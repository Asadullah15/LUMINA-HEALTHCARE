<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumina Health App</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2314A3A8'/%3E%3Cstop offset='1' stop-color='%231D5FD6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='20' cy='20' r='17' fill='url(%23g)'/%3E%3Cpath d='M28 2.8A19 19 0 0 1 38.3 15.1' fill='none' stroke='%23F6B13C' stroke-width='2.6' stroke-linecap='round'/%3E%3Crect x='17' y='10' width='6' height='20' rx='3' fill='%23fff'/%3E%3Crect x='10' y='17' width='20' height='6' rx='3' fill='%23fff'/%3E%3Ccircle cx='20' cy='20' r='2.6' fill='%23F6B13C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal-800:#05505A;--teal-700:#075E66;--teal-600:#0A7480;--teal-500:#0E8C99;--teal-300:#6CCBD1;--teal-100:#D3F0F2;--teal-50:#ECF8F9;
  --blue-700:#1747A6;--blue-600:#1D5FD6;--blue-100:#DCE7FC;--blue-50:#F0F5FF;--amber-500:#E8960F;--amber-400:#F6B13C;--amber-100:#FFF3DC;
  --violet-600:#6D4BD8;--violet-50:#F3EFFF;--rose-600:#D23F63;--rose-50:#FDEEF2;
  --ink:#0B2433;--ink-2:#34505F;--muted:#56707F;--line:#E2EBEF;--soft:#F5F9FA;--bg:#F1F6F7;
  --danger:#C2362B;--danger-50:#FDECEA;--success:#13795B;--success-50:#E3F6EE;
  --radius:16px;--shadow-sm:0 1px 2px rgba(11,36,51,.06),0 1px 3px rgba(11,36,51,.05);--shadow:0 4px 12px rgba(11,36,51,.06),0 12px 32px rgba(11,36,51,.07);--shadow-lg:0 20px 60px rgba(11,36,51,.2);
  --font:"Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:var(--teal-600);text-decoration:none}a:hover{color:var(--teal-700)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.25}
:focus-visible{outline:3px solid var(--amber-400);outline-offset:2px;border-radius:6px}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:16px;height:16px}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,#0B2433 0%,#0A2F3F 100%);color:#C8DCE3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:1.15rem;letter-spacing:-.02em;padding:4px 8px 8px}
.brand:hover{color:#fff}
.brand svg{width:34px;height:34px;flex:none}
.brand .wm-light{font-weight:500;color:var(--teal-300)}
.role-badge{margin:6px 8px 18px;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-size:.78rem;font-weight:700;align-self:flex-start}
.role-badge i{width:8px;height:8px;border-radius:50%;background:var(--amber-400)}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#B9CFD8;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(135deg,#0E8C99,#1D5FD6);color:#fff;box-shadow:0 6px 16px rgba(14,140,153,.35)}
.side-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.08);padding-top:14px;display:grid;gap:4px}
.side-foot a,.side-foot button{color:#B9CFD8;font-size:.88rem;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:10px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.side-foot a:hover,.side-foot button:hover{color:#fff;background:rgba(255,255,255,.06)}
.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 28px;min-height:66px}
.topbar h1{font-size:1.15rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-pill{font-size:.74rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--amber-100);color:#8A5300;white-space:nowrap}
.mode-pill.server{background:var(--success-50);color:var(--success)}
.who{display:flex;align-items:center;gap:10px}
.who .meta{text-align:right;line-height:1.2}
.who .meta b{display:block;font-size:.9rem}
.who .meta small{color:var(--muted);font-size:.78rem}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;color:#fff;background:linear-gradient(135deg,#0E8C99,#1D5FD6);flex:none}
.menu-btn{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer}
.view{padding:28px;max-width:1320px;width:100%}
.scrim{display:none}
@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:264px;z-index:50;transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(11,36,51,.45);z-index:40}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 16px}
  .view{padding:16px}
  .who .meta{display:none}
}
@media(max-width:520px){.mode-pill{display:none}}

/* ---------- hero & cards ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:28px 30px;color:#fff;background:linear-gradient(120deg,#0A4E5C 0%,#0E8C99 45%,#1D5FD6 100%);margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%}
.hero::before{width:300px;height:300px;right:-80px;top:-140px;background:rgba(255,255,255,.08)}
.hero::after{width:220px;height:220px;left:30%;bottom:-150px;background:radial-gradient(circle,rgba(246,177,60,.45),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:clamp(1.3rem,2.4vw,1.75rem);color:#fff}
.hero p{margin:6px 0 0;color:#DDF0F3}
.hero .actions .btn{background:#fff;color:var(--teal-700)}
.hero .actions .btn:hover{background:#F0FAFB}
.hero .actions .btn-amber{background:var(--amber-400);color:var(--ink)}
.hero-ill{width:120px;height:90px;opacity:.95}
@media(max-width:700px){.hero-ill{display:none}}
.perm{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden}
.perm summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 18px;font-weight:700}
.perm summary::-webkit-details-marker{display:none}
.perm summary .chev{margin-left:auto;transition:transform .2s;color:var(--muted)}
.perm[open] summary .chev{transform:rotate(180deg)}
.perm .lock-ic{width:32px;height:32px;border-radius:10px;background:var(--violet-50);color:var(--violet-600);display:grid;place-items:center}
.perm-body{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 18px 18px}
@media(max-width:700px){.perm-body{grid-template-columns:1fr}}
.perm-body h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.perm-body ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:.9rem}
.perm-body li{display:flex;gap:8px;align-items:flex-start}
.perm-body .yes h4{color:var(--success)}.perm-body .no h4{color:var(--danger)}
.perm-body .yes li::before{content:"✓";color:var(--success);font-weight:800}
.perm-body .no li::before{content:"✕";color:var(--danger);font-weight:800}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head h2{font-size:1.5rem}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--teal-500)}
.stat.blue::after{background:var(--blue-600)}.stat.amber::after{background:var(--amber-400)}.stat.green::after{background:var(--success)}.stat.violet::after{background:var(--violet-600)}.stat.rose::after{background:var(--rose-600)}
.stat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--teal-50);color:var(--teal-600);flex:none}
.stat.blue .ic{background:var(--blue-50);color:var(--blue-600)}.stat.amber .ic{background:var(--amber-100);color:var(--amber-500)}.stat.green .ic{background:var(--success-50);color:var(--success)}.stat.violet .ic{background:var(--violet-50);color:var(--violet-600)}.stat.rose .ic{background:var(--rose-50);color:var(--rose-600)}
.stat small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.stat b{font-size:1.5rem;letter-spacing:-.02em}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:22px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head h3{font-size:1rem;display:flex;align-items:center;gap:8px}
.panel-body{padding:18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid-3{display:grid;grid-template-columns:2fr 1fr;gap:22px}
@media(max-width:1060px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- buttons, chips, tables ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:999px;font-weight:700;font-size:.88rem;border:1.5px solid transparent;cursor:pointer;background:var(--teal-600);color:#fff;white-space:nowrap;transition:background .2s,border-color .2s,color .2s,transform .15s}
.btn:hover{background:var(--teal-700);color:#fff}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink-2)}
.btn-outline:hover{background:#fff;border-color:var(--teal-500);color:var(--teal-700)}
.btn-ghost{background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--soft);color:var(--ink)}
.btn-danger{background:#fff;border-color:#F3C5C0;color:var(--danger)}
.btn-danger:hover{background:var(--danger-50);color:var(--danger)}
.btn-amber{background:var(--amber-400);color:var(--ink)}
.btn-amber:hover{background:#F8BD57;color:var(--ink)}
.btn-violet{background:var(--violet-600)}.btn-violet:hover{background:#5A3BC0}
.btn-xs{padding:5px 11px;font-size:.8rem}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-weight:700;font-size:.75rem;background:var(--soft);color:var(--ink-2);white-space:nowrap;text-transform:capitalize}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.chip.plain::before{display:none}
.chip.teal{background:var(--teal-50);color:var(--teal-700)}.chip.blue{background:var(--blue-50);color:var(--blue-700)}.chip.amber{background:var(--amber-100);color:#8A5300}.chip.green{background:var(--success-50);color:var(--success)}.chip.red{background:var(--danger-50);color:var(--danger)}.chip.violet{background:var(--violet-50);color:var(--violet-600)}
.view-only{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--violet-600);background:var(--violet-50);padding:3px 10px;border-radius:999px;white-space:nowrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--soft);font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FAFDFD}
td .sub{display:block;color:var(--muted);font-size:.8rem}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.person{display:flex;gap:10px;align-items:center}
.person .avatar{width:34px;height:34px;font-size:.75rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.input{padding:9px 12px;border:1.5px solid #CBD8DE;border-radius:10px;background:#fff;min-height:40px}
.input:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(14,140,153,.15)}
.search{position:relative}
.search .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search .input{padding-left:36px;min-width:260px}
@media(max-width:560px){.search .input{min-width:0;width:100%}.search{flex:1}}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;margin:0}
dl.kv dt{color:var(--muted);font-weight:600;font-size:.86rem}
dl.kv dd{margin:0}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.muted{color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-bottom:14px}
.alert-chip{background:var(--danger-50);color:var(--danger);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.86rem;display:flex;gap:8px;align-items:center}

/* ---------- vitals ---------- */
.vitals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.vtile{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.vtile small{display:block;color:var(--muted);font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.vtile b{font-size:1.15rem}
.vtile span{font-size:.78rem;color:var(--muted)}
.vtile.high{background:var(--danger-50);border-color:#F3C5C0}.vtile.high b{color:var(--danger)}
.vtile.ok b{color:var(--success)}
.bmi-live{display:flex;align-items:center;gap:10px;background:var(--teal-50);border-radius:12px;padding:10px 14px;font-weight:700}

/* ---------- modal & forms ---------- */
.modal-back{position:fixed;inset:0;background:rgba(11,36,51,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:36px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);width:100%;max-width:580px;animation:pop .18s ease}
.modal.wide{max-width:900px}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:1.15rem}
.x-btn{width:36px;height:36px;border-radius:10px;border:0;background:var(--soft);cursor:pointer;display:grid;place-items:center;flex:none}
.modal-body{padding:22px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
.form-grid .full{grid-column:1/-1}
@media(max-width:620px){.form-grid,.form-grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.form-grid,.form-grid.three{grid-template-columns:1fr}}
.field label{display:block;font-weight:700;font-size:.82rem;margin-bottom:6px}
.field .req{color:var(--danger)}
.field .hint{font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid #CBD8DE;border-radius:10px;background:#fff;min-height:44px}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(14,140,153,.15)}
.field input:user-invalid,.field select:user-invalid{border-color:var(--danger)}
.form-error{background:var(--danger-50);color:var(--danger);border-radius:10px;padding:10px 14px;font-weight:600;font-size:.88rem;margin:16px 0 0}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.section-label{font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px dashed #B9CBD3;background:#fff;border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--ink-2)}
.quick button:hover{border-color:var(--teal-500);color:var(--teal-700);background:var(--teal-50)}
.line-row{display:grid;grid-template-columns:2fr 1fr 36px;gap:8px;margin-bottom:8px}
.line-row input{width:100%;padding:9px 10px;border:1.5px solid #CBD8DE;border-radius:10px;min-height:42px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--danger);flex:none}

/* ---------- consult / prescription writer ---------- */
.consult{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
@media(max-width:1100px){.consult{grid-template-columns:1fr}}
.consult aside .panel{margin-bottom:16px}
.pt-card{padding:18px;display:flex;gap:14px;align-items:center}
.pt-card .avatar{width:54px;height:54px;font-size:1.1rem}
.pt-card h3{font-size:1.1rem}
.med-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:linear-gradient(180deg,#FFFFFF,#FBFDFD)}
.med-top{display:flex;gap:10px;align-items:center}
.med-no{width:28px;height:28px;border-radius:50%;background:var(--teal-600);color:#fff;font-weight:800;font-size:.8rem;display:grid;place-items:center;flex:none}
.combo{position:relative;flex:1}
.combo input{width:100%;padding:10px 12px;border:1.5px solid #CBD8DE;border-radius:10px;min-height:44px;font-weight:700}
.combo input:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(14,140,153,.15)}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:30;list-style:none;margin:0;padding:6px;max-height:300px;overflow-y:auto}
.combo-list li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.combo-list li[aria-selected="true"],.combo-list li:hover{background:var(--teal-50)}
.combo-list li b{font-size:.9rem}
.combo-list li small{color:var(--muted);font-size:.78rem;text-align:right}
.combo-list mark{background:var(--amber-100);color:inherit;border-radius:3px;padding:0 1px}
.med-comp{width:100%;margin:8px 0 10px;padding:7px 10px;border:1px dashed #CBD8DE;border-radius:8px;font-size:.84rem;color:var(--ink-2);background:var(--soft)}
.med-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px}
@media(max-width:760px){.med-grid{grid-template-columns:1fr 1fr}}
.med-grid label,.dose .lbl{display:block;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.med-grid select,.med-grid input,.m-notes{width:100%;padding:8px 10px;border:1.5px solid #CBD8DE;border-radius:10px;min-height:40px;background:#fff}
.dose-3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dose-3 div{text-align:center}
.dose-3 span{display:block;font-size:.68rem;font-weight:700;color:var(--muted)}
.dose-3 select{text-align:center;font-weight:800;padding:8px 4px}
.dur{display:flex;gap:6px}
.dur input{width:64px;flex:none}
.m-notes{margin-top:10px;font-size:.88rem}

/* ---------- prescription & receipt documents ---------- */
.rxdoc{font-family:var(--font);color:#111;font-size:13px;line-height:1.45;background:#fff}
.rx-h{display:flex;justify-content:space-between;gap:20px;padding-bottom:12px;border-bottom:2px solid #0A7480;flex-wrap:wrap}
.rx-h .clinic{display:flex;gap:12px;align-items:center}
.rx-h .clinic svg{width:54px;height:54px;flex:none}
.rx-h .clinic b{display:block;font-size:20px;color:#0A7480;letter-spacing:-.01em}
.rx-h .clinic small{display:block;color:#1747A6;font-weight:700;font-size:11.5px}
.rx-h .clinic span{display:block;color:#444;font-size:11.5px}
.rx-h .doc-info{text-align:right}
.rx-h .doc-info b{display:block;font-size:19px;color:#1747A6}
.rx-h .doc-info .spec{color:#C2362B;font-weight:700}
.rx-h .doc-info span{display:block;font-size:12px;color:#333}
.rx-note{font-weight:700;font-size:12px;padding:8px 0;border-bottom:1px solid #ccc}
.rx-pt{display:grid;grid-template-columns:auto 1fr;gap:2px 18px;padding:10px 0;border-bottom:1px solid #999;font-size:12.5px}
.rx-pt b{font-weight:800}
.rx-vitals{padding:8px 0;font-size:12.5px}
.rx-vitals b{font-weight:800}
.rx-sec{margin:6px 0;white-space:pre-line}
.rx-sec>b{font-weight:800}
.rx-symbol{font-family:Georgia,serif;font-size:26px;font-weight:700;margin:8px 0 2px}
.rx-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rx-table th{background:none;text-transform:none;letter-spacing:0;color:#111;font-size:12.5px;border-top:1.5px solid #333;border-bottom:1.5px solid #333;padding:6px 8px}
.rx-table td{padding:7px 8px;border-bottom:1px solid #bbb;vertical-align:top}
.rx-table td .mname{font-weight:800;text-transform:uppercase}
.rx-table td .msub{display:block;font-size:11.5px;color:#444;padding-left:14px}
.rx-sign{display:flex;justify-content:flex-end;margin-top:24px;text-align:center}
.rx-sign .sig{font-family:"Brush Script MT","Segoe Script",cursive;font-size:24px;color:#1747A6}
.rx-foot{margin-top:18px;padding-top:8px;border-top:1px solid #999;text-align:center;font-size:11px;color:#444}
.rcpt-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:12px;flex-wrap:wrap}
.rcpt-title h3{font-size:18px;letter-spacing:.12em;color:#0A7480}
.stamp{border:3px solid currentColor;border-radius:10px;padding:4px 14px;font-weight:800;font-size:20px;letter-spacing:.15em;transform:rotate(-8deg);display:inline-block}
.stamp.paid{color:#13795B}.stamp.due{color:#C2362B}
.doc-wrap{border:1px solid var(--line);border-radius:14px;padding:26px;background:#fff}

/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow-lg);z-index:200;transition:transform .3s;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.err{background:var(--danger)}
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.84rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.bar-row{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;margin-bottom:10px;font-size:.86rem}
.bar-track{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar-fill{height:100%;border-radius:999px}
#print-area{display:none}
@media print{
  @page{margin:12mm}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important}
  .doc-wrap{border:0;padding:0}
}
</style>

/* ---- charts ---- */
function barChart(data){
  const W=600,H=220,L=36,R=12,T=24,B=34,max=Math.max(1,...data.map(d=>d.value)),bw=(W-L-R)/data.length;
  const nice=Math.ceil(max/1000)*1000||1000;
  let g="";for(let i=0;i<=4;i++){const y=T+(H-T-B)*i/4,v=nice*(1-i/4);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E2EBEF"/><text x="${L-6}" y="${y+4}" font-size="10" text-anchor="end" fill="#56707F">${v>=1000?(v/1000)+"k":v}</text>`}
  const bars=data.map((d,i)=>{const h=(H-T-B)*d.value/nice,x=L+i*bw+bw*.22,y=H-B-h,w=bw*.56;return `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="6" fill="url(#bar-g)"><title>${esc(d.label)}: ${money(d.value)}</title></rect>${d.value?`<text x="${x+w/2}" y="${y-6}" font-size="10" font-weight="700" text-anchor="middle" fill="#0B2433">${d.value>=1000?(d.value/1000).toFixed(1)+"k":d.value}</text>`:""}<text x="${x+w/2}" y="${H-12}" font-size="11" text-anchor="middle" fill="#56707F">${esc(d.label)}</text>`}).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Collections over the last 7 days"><defs><linearGradient id="bar-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E8C99"/><stop offset="1" stop-color="#1D5FD6"/></linearGradient></defs>${g}${bars}</svg></div>`;
}
function hBars(rows){const max=Math.max(1,...rows.map(r=>r.value));return rows.map(r=>`<div class="bar-row"><span>${esc(r.label)}</span><div class="bar-track"><div class="bar-fill" style="width:${r.value/max*100}%;background:${r.color}"></div></div><b style="text-align:right">${r.value}</b></div>`).join("")}

let comboSeq=0;
function closeComboLists(except){$$(".combo-list").forEach(l=>{if(l!==except){l.hidden=true;const i=l.parentNode.querySelector("input");i&&i.setAttribute("aria-expanded","false")}})}
document.addEventListener("click",e=>{if(!e.target.closest(".combo"))closeComboLists()});
function searchMeds(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const scored=[];
  MEDS.forEach((m,i)=>{const b=m.brand.toLowerCase(),n=m.name.toLowerCase(),c=m.comp.toLowerCase();let s=-1;
    if(b.startsWith(q))s=0;else if(b.split(/[\s-]/).some(w=>w.startsWith(q)))s=1;else if(n.includes(q))s=2;else if(c.includes(q))s=3;
    if(s>=0)scored.push([s,i,m])});
  // same match quality -> keep database order (most commonly used strengths are listed first)
  return scored.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,9).map(x=>x[2]);
}
function hl(text,q){const i=text.toLowerCase().indexOf(q.toLowerCase());return i<0?esc(text):esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length))}

      <div><label>When</label>${sel("m-when",WHEN_OPTS,"After food")}</div>

function applyMed(card,m){
  $(".m-name",card).value=m.name;$(".m-comp",card).value=m.comp;
  const d=m.dose.split("-");
  if(d.length===3)[".d-m",".d-a",".d-n"].forEach((c,i)=>{const s=$(c,card);if(DOSE_OPTS.includes(d[i]))s.value=d[i]});
  if(WHEN_OPTS.includes(m.when))$(".m-when",card).value=m.when;
  if(FREQ_OPTS.includes(m.freq))$(".m-freq",card).value=m.freq;
  $(".m-dur-n",card).value=m.durN;$(".m-dur-u",card).value=m.durU;
  $(".m-notes",card).value=m.notes||"";
}
function wireMedCard(card){
  const input=$(".m-name",card),list=$(".combo-list",card);let items=[],active=-1;
  const draw=()=>{
    const q=input.value;items=searchMeds(q);active=items.length?0:-1;
    if(!q.trim()){list.hidden=true;input.setAttribute("aria-expanded","false");return}
    list.innerHTML=items.map((m,i)=>`<li role="option" id="${list.id}-${i}" aria-selected="${i===active}" data-i="${i}"><b>${hl(m.name,q)}</b><small>${hl(m.comp,q)}</small></li>`).join("")+(items.length?"":`<li role="option" aria-selected="false" data-custom><b>Use “${esc(q)}”</b><small>Not in list, add as typed</small></li>`);
    list.hidden=false;input.setAttribute("aria-expanded","true");closeComboLists(list);
    input.setAttribute("aria-activedescendant",active>=0?list.id+"-"+active:"");
  };
  const pick=i=>{if(items[i])applyMed(card,items[i]);list.hidden=true;input.setAttribute("aria-expanded","false");$(".m-comp",card).focus()};
  input.addEventListener("input",draw);
  input.addEventListener("focus",()=>{if(input.value)draw()});
  input.addEventListener("keydown",e=>{
    if(list.hidden)return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!items.length)return;active=(active+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;$$("li",list).forEach((li,i)=>li.setAttribute("aria-selected",i===active));input.setAttribute("aria-activedescendant",list.id+"-"+active);const li=$$("li",list)[active];li&&li.scrollIntoView({block:"nearest"})}
    else if(e.key==="Enter"){e.preventDefault();if(active>=0)pick(active);else{list.hidden=true}}
    else if(e.key==="Escape"){list.hidden=true;input.setAttribute("aria-expanded","false")}
  });
  list.addEventListener("mousedown",e=>{e.preventDefault();const li=e.target.closest("li");if(!li)return;if(li.hasAttribute("data-custom")){list.hidden=true;$(".m-comp",card).focus()}else pick(+li.dataset.i)});
}
function readMeds(root){
  return $$(".med-card",root).map(c=>{
    const n=+$(".m-dur-n",c).value,u=$(".m-dur-u",c).value;
    return {name:$(".m-name",c).value.trim(),composition:$(".m-comp",c).value.trim(),dosage:[".d-m",".d-a",".d-n"].map(s=>$(s,c).value).join("-"),timing:$(".m-when",c).value,frequency:$(".m-freq",c).value,duration:n?n+" "+(n===1?u.replace(/s$/,""):u):"",notes:$(".m-notes",c).value.trim()};
  }).filter(m=>m.name);
}

VIEWS.billing=async()=>{

  const cols=[{h:"Receipt",f:i=>`<b>${esc(i.number)}</b><span class="sub">${fmtDate(i.date)} ${fmtTime(i.time)}</span>`}];
  if(me.role!=="patient")cols.push({h:"Patient",f:i=>`<div class="person">${avatar(i.patientName)}<span><b>${esc(i.patientName)}</b><span class="sub">UHID ${esc(i.patientUhid)}</span></span></div>`});
  cols.push({h:"Items",f:i=>esc(i.items.map(x=>x.description).join(", "))},{h:"Amount",num:true,f:i=>`<b>${money(i.total)}</b>${i.discount?`<span class="sub">incl. ${money(i.discount)} off</span>`:""}`},{h:"Status",f:i=>chip(i.status)+(i.mode?`<span class="sub">${esc(i.mode)}</span>`:"")},
    {h:"Actions",f:i=>`<div class="row-actions"><button class="btn btn-outline btn-xs" data-inv="${i.id}">${icon("i-printer","icon-sm")}View</button>${staff&&i.status!=="paid"?`<button class="btn btn-xs" data-pay="${i.id}">Mark paid</button>`:""}</div>`});
  view.innerHTML=pageHead(me.role==="patient"?"My receipts":"Receipts",me.role==="admin"?"Read-only. Reception issues receipts and records payments.":null,staff?`<button class="btn btn-amber" id="new-inv">${icon("i-plus","icon-sm")}New receipt</button>`:(me.role==="admin"?viewOnly:""))+
    statCards([{label:"Paid",value:money(paid),icon:"i-check",tone:"green"},{label:"Due",value:money(due),icon:"i-receipt",tone:"amber"},{label:"Receipts",value:list.length,icon:"i-file",tone:"blue"}])+

  $$("[data-inv]").forEach(b=>b.addEventListener("click",()=>receiptModal(list.find(i=>i.id===b.dataset.inv))));

    formModal("Record payment",fld("mode","Payment mode",{options:["UPI","Cash","Card","Net banking"],full:true}),"Mark as paid",d=>
      api("PUT","/api/invoices/"+b.dataset.pay,{status:"paid",mode:d.mode}).then(inv=>{closeModal();toast("Payment recorded");rerender();setTimeout(()=>receiptModal(inv),150)}));
  }));
  const n=$("#new-inv");if(n)n.addEventListener("click",safe(()=>newReceiptModal()));
};
async function newReceiptModal(presetPatientId,doctorName){
  const patients=await api("GET","/api/patients");
  const row=(desc,amt)=>`<div class="line-row"><input name="i_desc" placeholder="Description" aria-label="Item description" value="${esc(desc||"")}"><input name="i_amt" type="number" min="0" step="0.01" placeholder="Amount ₹" aria-label="Amount in rupees" value="${esc(amt||"")}"><button type="button" class="icon-btn" data-remove aria-label="Remove item">${icon("i-trash","icon-sm")}</button></div>`;
  const inner=fld("patientId","Patient",{required:true,options:patientOptions(patients),value:presetPatientId,full:true})+
    `<div class="full"><div class="section-label" style="margin-top:4px">Items · quick add</div><div class="quick" style="margin-bottom:10px">${RECEIPT_ITEMS.map(([d,a])=>`<button type="button" data-item="${esc(d)}" data-amt="${a}">+ ${esc(d)} ₹${a}</button>`).join("")}</div><div id="items">${row(doctorName?"Consultation — "+doctorName:"Consultation",800)}</div><button type="button" class="btn btn-outline btn-xs" id="add-item">${icon("i-plus","icon-sm")}Add item</button></div>`+
    fld("discount","Discount ₹",{type:"number",min:0,step:"0.01",value:0})+`<div class="field"><label>Total</label><div class="bmi-live" id="inv-total">₹800</div></div>`+
    fld("status","Payment",{options:[["paid","Paid now"],["unpaid","Pay later (due)"]]})+fld("mode","Payment mode",{options:["UPI","Cash","Card","Net banking"]});
  const form=formModal("New receipt",inner,"Create receipt",d=>{
    const items=$$("#items .line-row",form).map(r=>({description:$("[name=i_desc]",r).value.trim(),amount:Number($("[name=i_amt]",r).value)})).filter(i=>i.description&&i.amount>0);
    if(!items.length)throw new Error("Add at least one item with an amount.");
    return api("POST","/api/invoices",{patientId:d.patientId,status:d.status,mode:d.mode,discount:d.discount,items}).then(inv=>{toast("Receipt "+inv.number+" created");if(location.hash.indexOf("billing")>=0||location.hash.indexOf("dashboard")>=0||!location.hash)rerender();setTimeout(()=>receiptModal(inv),150)});
  },{wide:true});
  const total=()=>{const s=$$("[name=i_amt]",form).reduce((a,i)=>a+(Number(i.value)||0),0)-(Number($("[name=discount]",form).value)||0);$("#inv-total",form).textContent=money(Math.max(0,s))};
  $("#add-item",form).addEventListener("click",()=>{$("#items",form).insertAdjacentHTML("beforeend",row());$$("#items .line-row",form).pop().querySelector("input").focus()});
  $$("[data-item]",form).forEach(b=>b.addEventListener("click",()=>{const empty=$$("#items .line-row",form).find(r=>!$("[name=i_desc]",r).value.trim());if(empty){$("[name=i_desc]",empty).value=b.dataset.item;$("[name=i_amt]",empty).value=b.dataset.amt}else $("#items",form).insertAdjacentHTML("beforeend",row(b.dataset.item,b.dataset.amt));total()}));
  form.addEventListener("input",total);
  form.addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(b&&$$("#items .line-row",form).length>1){b.closest(".line-row").remove();total()}});
}

function userModal(u){
  const isDoc=!u||u.role==="doctor";
  const inner=fld("name","Full name",{required:true,value:u&&u.name,full:true})+
    fld("email","Email (login ID)",{type:"email",required:true,value:u&&u.email,autocomplete:"off"})+
    fld("role","Role",{required:true,options:[["doctor","Doctor"],["nurse","Nurse"],["reception","Reception"],["patient","Patient"],["admin","Admin"]],value:u?u.role:"doctor"})+
    fld("qualification","Qualification",{value:u&&u.qualification,placeholder:"e.g. MBBS, MD",wrapId:"w-qual",hidden:!isDoc})+
    fld("specialty","Specialty",{value:u&&u.specialty,placeholder:"e.g. Cardiologist",wrapId:"w-spec",hidden:!isDoc})+
    fld("regNo","Medical registration no.",{value:u&&u.regNo,wrapId:"w-reg",hidden:!isDoc})+
    fld("phone","Mobile number",{type:"tel",value:u&&u.phone,pattern:PHONE_PATTERN})+
    (u?fld("active","Status",{options:[["true","Active"],["false","Deactivated"]],value:String(u.active)}):"")+
    fld("password",u?"New password (leave blank to keep)":"Password",{type:"password",required:!u,minlength:8,full:true,autocomplete:"new-password",placeholder:"At least 8 characters"});
  const form=formModal(u?"Edit user":"Add user",inner,u?"Save changes":"Create user",d=>{
    if(u&&!d.password)delete d.password;
    return api(u?"PUT":"POST","/api/users"+(u?"/"+u.id:""),d).then(()=>{closeModal();toast(u?"User updated":"User created");rerender()});
  },{wide:true});
  const role=$("[name=role]",form);
  role.addEventListener("change",()=>["#w-qual","#w-spec","#w-reg"].forEach(s=>$(s,form).hidden=role.value!=="doctor"));
}

    panel("Change password",`<form class="panel-body" id="pw-form"><div class="form-grid">${fld("current","Current password",{type:"password",required:true,full:true,autocomplete:"current-password"})}${fld("password","New password",{type:"password",required:true,minlength:8,autocomplete:"new-password",placeholder:"At least 8 characters"})}${fld("confirm","Confirm new password",{type:"password",required:true,minlength:8,autocomplete:"new-password"})}</div><p class="form-error" role="alert" hidden></p><div class="modal-actions"><button class="btn" type="submit">Update password</button></div></form>`)+`</div>`+permCard();

/* ================= boot ================= */
async function boot(){
  try{
    mode=await client.mode();
    me=(await api("GET","/api/me")).user;
  }catch(e){location.replace("login.html");return}
  [doctors,settings]=await Promise.all([api("GET","/api/doctors"),api("GET","/api/settings")]);
  $("#nav").innerHTML=NAV[me.role].map(n=>`<li><a href="#/${n[0]}" data-route="${n[0]}">${icon(n[2])}${esc(n[1])}</a></li>`).join("");
  $("#who-name").textContent=me.name;$("#who-role").textContent=ROLE_LABEL[me.role]+(me.specialty?" · "+me.specialty:"");
  const av=$("#who-avatar");av.textContent=initials(me.name);av.style.background=avColor(me.name);
  $("#role-badge span").textContent=ROLE_LABEL[me.role]+" workspace";
  const mp=$("#mode-pill");mp.textContent=mode==="server"?"● Live database":"● Demo mode · saved in this browser";mp.classList.toggle("server",mode==="server");
  mp.title=mode==="server"?"Connected to the Lumina server (data.json)":"Run start.bat to use the shared database";
  if(mode==="demo"){const r=$("#reset-demo");r.hidden=false;r.addEventListener("click",()=>{if(confirm("Reset all demo data back to the original sample data?")){client.resetDemo();location.replace("login.html")}})}
  $("#boot").hidden=true;$("#app").hidden=false;
  $("#menu-btn").addEventListener("click",()=>setSide(!$("#side").classList.contains("open")));
  $("#scrim").addEventListener("click",()=>setSide(false));
  $("#logout").addEventListener("click",()=>api("POST","/api/logout").then(()=>location.replace("login.html")));
  window.addEventListener("hashchange",render);
  render();
}
boot();
})();
